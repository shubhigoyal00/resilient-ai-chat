# Render blueprint: deploys the FastAPI backend with a persistent /data disk.
# Deploy the frontend separately on Vercel (see README).
services:
  - type: web
    name: resilient-ai-chat-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    disk:
      name: chat-sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini/gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
