services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini/gemini-2.5-flash}
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; the browser calls this URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
